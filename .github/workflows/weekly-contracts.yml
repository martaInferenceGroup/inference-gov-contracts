name: Weekly Contract Report

on:
  schedule:
    # Every Friday at 8:30 AM UK time (7:30 UTC in BST, 8:30 UTC in GMT)
    - cron: '30 7 * * 5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to commit tracking data back to repo

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run weekly report
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: python -m src.notifications.weekly_report

      - name: Commit tracking data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracking/contracts.json data/processed/weekly_*.json
          git diff --staged --quiet || git commit -m "Update contract tracking data [skip ci]"
          git push

      - name: Alert on failure
        if: failure()
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          try:
              from src.notifications.weekly_report import send_email, _get_access_token
              send_email(
                  '<div style=\"font-family:Roboto,sans-serif;padding:20px;\">'
                  '<h2 style=\"color:#dc3545;\">Weekly Contract Report Failed</h2>'
                  '<p>The scheduled weekly report did not send successfully.</p>'
                  '<p>Check <a href=\"https://github.com/${{ github.repository }}/actions\">GitHub Actions</a> for details.</p>'
                  '</div>',
                  recipients=['marta@inferencegroup.com'],
                  subject='[Alert] Weekly Gov Contracts Report Failed',
                  from_email='marta@inferencegroup.com',
              )
              print('Failure alert sent.')
          except Exception as e:
              print(f'Could not send failure alert: {e}')
          "
